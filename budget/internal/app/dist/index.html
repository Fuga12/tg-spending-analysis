    <title>Бюджет</title>
    <!--
      SDK Telegram. Без него window.Telegram не существует, initData пустой,
      заголовок Authorization не уходит — и сервер честно отвечает «открой
      приложение из Telegram» на собственное же приложение.

      defer, а не синхронный тег: скрипт едет с telegram.org, и синхронный
      блокировал бы отрисовку до его загрузки — на медленной сети это белый
      экран вместо приложения. Порядок при этом сохраняется: отложенные и
      модульные скрипты выполняются в порядке документа, так что main.tsx
      увидит SDK готовым.

      Если скрипт всё же не доедет, приложение не сломается: подпись лежит
      ещё и в адресе страницы, см. initData() в api.ts.
    -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" crossorigin src="/assets/index-DdiNe2Jr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C_x_Jh4q.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
