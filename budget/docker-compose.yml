name: budget

services:
  postgres:
    image: postgres:16
    container_name: budget_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - budget_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: strochka-budget-bot:local
    container_name: budget_bot
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 120s

volumes:
  budget_pgdata:
