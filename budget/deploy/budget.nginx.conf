# nginx перед приложением. Положить в /etc/nginx/sites-available/budget,
# заменить budget.example.com на свой домен, включить симлинком в
# sites-enabled и перечитать конфиг.
#
# Проксируется всё одним location, а не отдельно /api и отдельно статика:
# приложение отдаёт и то, и другое само — фронт лежит внутри бинаря, и
# маршрутизация внутри приложения своя. Разделять здесь нечего, а лишний
# location — это лишнее место, где можно разойтись с сервером.

server {
    listen 80;
    listen [::]:80;
    server_name budget.example.com;

    # ACME-проверка Let's Encrypt должна ходить по http, остальное — на https.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name budget.example.com;

    ssl_certificate     /etc/letsencrypt/live/budget.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Фото профиля приложение принимает до 512 КБ. Мегабайт — запас на
    # накладные расходы запроса; больше незачем, меньше сломает загрузку фото.
    client_max_body_size 1m;

    # X-Frame-Options и frame-ancestors здесь НЕ ставить. В Telegram Web
    # Mini App открывается во фрейме, и запрет встраивания даёт пустое окно
    # без единой ошибки, которую видно снаружи.

    access_log /var/log/nginx/budget.access.log;
    error_log  /var/log/nginx/budget.error.log;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Заголовок Authorization несёт подпись Telegram — единственное, чем
        # приложение вообще узнаёт человека. nginx передаёт его сам, но если
        # где-то выше стоит proxy_set_header со своим списком, подпись
        # потеряется, и внутрь не попадёт никто.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Приложение само проставляет Cache-Control: файлам с хешем в имени —
        # навсегда, index.html — никогда. Переопределять его здесь значит либо
        # раздавать устаревший фронт, либо качать его заново на каждом открытии.
        proxy_read_timeout 30s;
    }
}
